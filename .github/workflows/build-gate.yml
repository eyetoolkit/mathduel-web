# 构建门禁（Phase 2.3，2026-10-06）
#
# 本仓库此前**完全没有 CI** —— tsc 与 vite build 只在我本机跑过，
# 类型错误、构建失败可以直接推到 main 并自动上 Pages。
# 后端 tri-sites 从建库起 CI 红了 120 次，本仓库连门禁都没有；
# 两者一起说明「绿灯」在这里从来没有被真正验证过。
#
# 本 workflow 只做一件事：`pnpm build`。四个仓库的 build 脚本都是
#   tsc --noEmit && vite build && <copy-legacy / filter-sitemap>
# 所以这一条命令就同时覆盖了类型检查与生产构建，不需要额外的 typecheck 步骤。
#
# 注意：本 workflow 不部署 —— Pages 由 push main 自动部署。
# 它的价值是**在部署之前**把类型/构建错误挡住，避免坏包上线路。
#
# 2026-10-16 新增 inmatch-gate job：对局页沉浸布局几何门禁。
# 起因：numeriduel 对局页连续两轮布局回归（棋盘被裁 / 棋盘不沉浸），
# tsc / i18n / lang-leak / brand 全绿却照样上线 —— 门禁里没有任何几何断言。
# 该 job 在 build 之后起 vite preview，用无头 Chrome 按同一套判据
# （行数完整 / 无裁切 / 控件可达 / 字号不溢出 / 沉浸场景零滚动）跑 14 个场景。

name: build-gate

on:
  push:
    branches: [main]
    paths:
# legacy/ 也会被 copy-legacy.mjs 拷进产物，改动同样需要门禁覆盖。
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'index.html'
      - 'games/**'
      - 'daily/**'
      - 'me/**'
      - 'worksheets/**'
      - 'privacy/**'
      - 'legacy/**'
      - 'tailwind.config.ts'
      - 'postcss.config.js'
      - 'vendor/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/build-gate.yml'
  pull_request:
    branches: [main]
    paths:
# legacy/ 也会被 copy-legacy.mjs 拷进产物，改动同样需要门禁覆盖。
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'index.html'
      - 'games/**'
      - 'daily/**'
      - 'me/**'
      - 'worksheets/**'
      - 'privacy/**'
      - 'legacy/**'
      - 'tailwind.config.ts'
      - 'postcss.config.js'
      - 'vendor/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/build-gate.yml'

# 同一分支的新 push 直接取消在跑的旧构建，省 CI 配额
concurrency:
  group: build-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 版本从 package.json 的 packageManager 字段读取（四个仓库都是 pnpm@10.11.1）
      - uses: pnpm/action-setup@v4

      # engines 声明 ">=20.0.0 <23"，故固定 22
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      # tsc --noEmit + vite build + 产物后处理，一步到位
      - name: Type check + build
        run: pnpm build

  # 对局沉浸布局几何门禁：需要构建产物 + 无头浏览器，故独立 job（可单独重跑）
  inmatch-gate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (产物供 preview 使用)
        run: pnpm build

      # preview 与门禁必须在同一个 step：step 结束会回收后台进程。
      # 端口探测就绪后再跑，避免「服务器还没起来」的假失败。
      - name: In-match geometry gate
        run: |
          pnpm preview --port 4173 > /tmp/preview.log 2>&1 &
          PV=$!
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:4173/games/sudoku/ > /dev/null 2>&1; then break; fi
            if ! kill -0 $PV 2>/dev/null; then echo "preview died"; cat /tmp/preview.log; exit 2; fi
            sleep 1
          done
          node scripts/check-inmatch-geometry.mjs
          RC=$?
          kill $PV 2>/dev/null || true
          exit $RC

      # 失败时把判据数据与截图带回来（.inmatch-gate/ 含 fail-*.png 与 result.json）
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: inmatch-gate-failures
          path: .inmatch-gate/
          if-no-files-found: ignore

  # 页面 smoke 门禁（2026-10-21）：首页 home-v2 + 5 lobby + daily/me/worksheets/shop
  # 的 DOM 渲染回归。起因：tests/ 原有三个文件全部不可执行（playwright 未装 /
  # 他人机器路径 / 断言改版前首页），本仓对首页与主页面渲染零机器防线。
  # 零依赖 CDP 范式（同 inmatch），不断言 console/pageerror（preview 无后端，
  # API 失败噪音会假红）。
  smoke-gate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (产物供 preview 使用)
        run: pnpm build

      # preview 与门禁必须在同一个 step：step 结束会回收后台进程。
      - name: Page smoke gate
        run: |
          pnpm preview --port 4173 > /tmp/preview.log 2>&1 &
          PV=$!
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:4173/ > /dev/null 2>&1; then break; fi
            if ! kill -0 $PV 2>/dev/null; then echo "preview died"; cat /tmp/preview.log; exit 2; fi
            sleep 1
          done
          pnpm test:smoke
          RC=$?
          kill $PV 2>/dev/null || true
          exit $RC

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-gate-failures
          path: .smoke-gate/
          if-no-files-found: ignore
