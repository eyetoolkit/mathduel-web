<!doctype html>
<html lang="en" data-site="mathduel">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0E1419" />
  <title>Sudoku 9×9 — Fill the Grid First | MathDuel</title>
  <meta name="description" content="The classic 9×9 logic grid with a full difficulty ladder and a daily seeded puzzle. Pencil in candidates, race a bot, or beat the clock." />
  <link rel="canonical" href="https://mathduel.games/games/sudoku/" />
  <!-- PWA + favicons -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <!-- Open Graph / Twitter -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="MathDuel" />
  <meta property="og:url" content="https://mathduel.games/games/sudoku/" />
  <meta property="og:image" content="https://mathduel.games/og-image.svg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="MathDuel — Six math arenas, one Elo ladder" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@mathduel" />
  <meta name="twitter:creator" content="@mathduel" />
  <meta name="twitter:image" content="https://mathduel.games/og-image.svg" />
  <!-- hreflang (站点仅英文版，x-default = en) -->
  <link rel="alternate" hreflang="en" href="https://mathduel.games/games/sudoku/" />
  <link rel="alternate" hreflang="x-default" href="https://mathduel.games/games/sudoku/" />
  <link rel="preload" href="/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/sora-latin.woff2" as="font" type="font/woff2" crossorigin />
</head>
<body class="arena">
  <div id="header"></div>

  <!-- ═══ Play · 模式选择已独立到 /games/sudoku/lobby/ ═══ -->
  <main class="g24 s9-play" id="playView">
    <section class="board" id="boardCol" aria-label="Sudoku board">
      <div class="g24-bar">
        <nav class="tabs" id="tabs" aria-label="Game modes">
          <button class="tab" data-mode="solo">Solo</button>
          <button class="tab" data-mode="daily">Daily Grid</button>
          <button class="tab" data-mode="timed">Timed</button>
          <button class="tab" data-mode="duel">Duel Bot</button>
        </nav>
        <div class="top-stats">
          <span class="chip" id="stMain">Ready</span>
          <button class="icon-btn" id="backLobby" title="Back to lobby">🏠 Lobby</button>
        </div>
      </div>

      <!-- 对局头（仅 Duel）：对手条（teal） -->
      <div id="oppHead" class="s9-opp-head hidden">
        <div class="player">
          <span class="md-av">🤖</span>
          <div><div class="pn">GridBot <span class="side-tag opp"><span class="d"></span>Bot</span></div><div class="ps" id="oppSub">standard pace</div></div>
        </div>
        <div class="status thinking" id="oppStatus"><span class="d"></span>Filled 0/0</div>
      </div>

      <div id="modeBanner"></div>

      <div class="table-head">
        <div class="target"><span class="lbl">Target</span><b>1–9</b></div>
        <div class="diff-pick" id="diffPick" role="group" aria-label="Difficulty">
          <button data-d="easy">Easy</button>
          <button data-d="standard" class="active">Medium</button>
          <button data-d="hard">Hard</button>
        </div>
      </div>

      <div class="s9-board-wrap">
        <div class="s9-board" id="s9board" role="grid" aria-label="9 by 9 sudoku grid"></div>
        <div class="s9-pad" id="s9pad">
          <button class="pk" data-v="1">1<small class="pk-left"></small></button>
          <button class="pk" data-v="2">2<small class="pk-left"></small></button>
          <button class="pk" data-v="3">3<small class="pk-left"></small></button>
          <button class="pk" data-v="4">4<small class="pk-left"></small></button>
          <button class="pk" data-v="5">5<small class="pk-left"></small></button>
          <button class="pk" data-v="6">6<small class="pk-left"></small></button>
          <button class="pk" data-v="7">7<small class="pk-left"></small></button>
          <button class="pk" data-v="8">8<small class="pk-left"></small></button>
          <button class="pk" data-v="9">9<small class="pk-left"></small></button>
          <div class="s9-padfoot">
            <button class="pk erase" data-act="erase">⌫ Erase</button>
            <button class="pk notes" data-act="notes" id="notesBtn">✏ Notes</button>
          </div>
        </div>
        <div class="s9-padtools hidden" id="padTools">
          <button class="btn ghost" id="hintBtn">💡 Hint</button>
          <button class="btn ghost" id="newBtn">↻ New Grid</button>
        </div>
      </div>

      <div class="result" id="result" role="status">Pick a cell, then a number</div>

      <!-- 我方条（仅 Duel）：进度 HUD（替代速度环） -->
      <div id="youHead" class="s9-you-head hidden">
        <div class="s9-hud">
          <div class="hud-row"><span>You</span><b class="num" id="youFilled">0/0</b></div>
          <div class="hud-row"><span>GridBot</span><b class="num" id="oppFilled">0/0</b></div>
          <div class="hud-row"><span>Mistakes</span><span class="lives" id="lives"><i></i><i></i><i></i></span></div>
          <div class="hud-row"><span>Time</span><b class="num" id="duelTime">0:00</b></div>
        </div>
      </div>

      <!-- Duel bot 聊天 -->
      <div class="chat-dock hidden" id="chatDock" aria-label="Match chat"></div>
    </section>

    <aside class="side" id="side"></aside>
  </main>

  <div class="overlay" id="overlay"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/src/games/sudoku/index.ts"></script>
</body>
</html>
