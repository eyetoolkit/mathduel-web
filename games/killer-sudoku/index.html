<!doctype html>
<html lang="en" data-site="mathduel">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0E1419" />
  <title>Killer Sudoku · Cage-Sum Arena | MathDuel</title>
  <meta name="description" content="Standard Sudoku rules plus cage-sum constraints: every dashed cage must add up to the number in its corner. Three difficulties by cage count, zero givens." />
  <link rel="canonical" href="https://mathduel.games/games/killer-sudoku/" />
  <!-- PWA + favicons -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <!-- Open Graph / Twitter -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="MathDuel" />
  <meta property="og:url" content="https://mathduel.games/games/killer-sudoku/" />
  <meta property="og:image" content="https://mathduel.games/og-image.svg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="MathDuel — Six math arenas, one Elo ladder" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@mathduel" />
  <meta name="twitter:creator" content="@mathduel" />
  <meta name="twitter:image" content="https://mathduel.games/og-image.svg" />
  <!-- hreflang (站点仅英文版，x-default = en) -->
  <link rel="alternate" hreflang="en" href="https://mathduel.games/games/killer-sudoku/" />
  <link rel="alternate" hreflang="x-default" href="https://mathduel.games/games/killer-sudoku/" />
  <link rel="preload" href="/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/sora-latin.woff2" as="font" type="font/woff2" crossorigin />
</head>
<body class="arena">
  <div id="header"></div>

  <main class="k9-arena">
    <div class="k9-top">
      <div class="k9-tabs" id="tabs">
        <button class="k9-tab" data-mode="solo">Solo</button>
        <button class="k9-tab" data-mode="daily">Daily</button>
        <button class="k9-tab" data-mode="timed">Timed</button>
        <button class="k9-tab" data-mode="duel">Duel Bot</button>
      </div>
      <button class="k9-back" id="backLobby" type="button" title="Mode select">← Mode select</button>
    </div>

    <div class="k9-opp" id="oppHead" hidden>
      <div class="k9-player">
        <div class="k9-av" aria-hidden="true"></div>
        <div>
          <div class="k9-pn">Bot <span class="k9-side opp"><span class="d"></span>Opponent</span></div>
          <div class="k9-ps" id="oppPace">— · ~6s per cell</div>
        </div>
      </div>
      <div class="k9-status" id="oppStatus"><span class="d"></span>Filled · 0 / 0</div>
    </div>

    <div id="modeBanner"></div>

    <div class="k9-diff" id="diffPick" role="group" aria-label="Difficulty by cage count">
      <button class="k9-pk" data-d="gentle">Gentle<small>26 cages</small></button>
      <button class="k9-pk active" data-d="standard">Standard<small>29 cages</small></button>
      <button class="k9-pk" data-d="fierce">Fierce<small>34 cages</small></button>
    </div>

    <!-- ============ 棋盘：9×9 CSS grid + 笼子 SVG 层 + 角标和值层 ============ -->
    <div class="k9-board-wrap" id="boardWrap">
      <div class="k9-board" id="k9board" role="grid" aria-label="9x9 killer sudoku board"></div>
      <svg class="k9-cage" id="k9cage" viewBox="0 0 9 9" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="k9-sum" id="k9sum" aria-hidden="true"></div>
    </div>

    <!-- ============ HUD：当前 cage 算术 + 进度 ============ -->
    <div class="k9-hud" id="hud" aria-live="polite">
      <div class="k9-hud-row"><span class="k9-hl">This cage</span><span class="k9-arith num" id="hudThis">— · pick a cell</span></div>
      <div class="k9-hud-row"><span class="k9-hl">Cages cleared</span><span class="k9-arith num" id="hudCages">0 / 0</span></div>
      <div class="k9-hud-row"><span class="k9-hl">Time</span><span class="k9-arith num" id="hudTime">0:00</span></div>
      <div class="k9-hud-row"><span class="k9-hl">Mistakes</span><span class="k9-lives" id="hudLives"><i></i><i></i><i></i><i></i><i></i></span></div>
    </div>

    <div class="k9-pad" id="k9pad">
      <button class="k9-pk" data-v="1">1<span class="pk-left"></span></button>
      <button class="k9-pk" data-v="2">2<span class="pk-left"></span></button>
      <button class="k9-pk" data-v="3">3<span class="pk-left"></span></button>
      <button class="k9-pk" data-v="4">4<span class="pk-left"></span></button>
      <button class="k9-pk" data-v="5">5<span class="pk-left"></span></button>
      <button class="k9-pk" data-v="6">6<span class="pk-left"></span></button>
      <button class="k9-pk" data-v="7">7<span class="pk-left"></span></button>
      <button class="k9-pk" data-v="8">8<span class="pk-left"></span></button>
      <button class="k9-pk" data-v="9">9<span class="pk-left"></span></button>
      <div class="k9-padfoot">
        <button class="k9-pk erase" data-act="erase" id="eraseBtn">⌫ Erase</button>
        <button class="k9-pk notes" data-act="notes" id="notesBtn">✎ Notes</button>
      </div>
    </div>

    <div class="k9-tools" id="padTools">
      <button class="k9-tool" id="hintBtn" title="Reveal a cell">💡 Hint</button>
      <button class="k9-tool" id="newBtn" title="Fresh board">🔄 New</button>
    </div>

    <div id="result" class="k9-result" hidden></div>

    <div class="k9-you" id="youHead">
      <div class="k9-player">
        <div class="k9-av you" aria-hidden="true"></div>
        <div>
          <div class="k9-pn">You <span class="k9-side you"><span class="d"></span>You</span></div>
          <div class="k9-ps" id="youPace">— pace</div>
        </div>
      </div>
      <div class="k9-status you" id="youStatus"><span class="d"></span>Filled · 0 / 0</div>
    </div>

    <div class="k9-chatdock" id="chatDock" hidden>
      <div class="k9-chatlog" id="chatLog" aria-live="polite"></div>
      <div class="k9-quickline">
        <button class="k9-qb" data-msg="nice">nice</button>
        <button class="k9-qb" data-msg="close">close</button>
        <button class="k9-qb" data-msg="think">thinking…</button>
        <button class="k9-qb" data-msg="oof">oof</button>
      </div>
    </div>

    <!-- ============ Modal + Toast ============ -->
    <div class="k9-overlay" id="overlay" hidden>
      <div class="k9-modal" id="modal" role="dialog" aria-modal="true">
        <div class="k9-mtitle" id="mTitle">—</div>
        <div class="k9-msub" id="mSub">—</div>
        <div class="k9-mact" id="mActs"></div>
      </div>
    </div>
    <div class="k9-toast" id="toast" hidden></div>
  </main>

  <script type="module" src="/src/games/killer-sudoku/index.ts"></script>
</body>
</html>
